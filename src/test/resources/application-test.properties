# Test Configuration for Integration Tests
# This configuration is used when @ActiveProfiles("test") is applied

# Logging
logging.level.root=WARN
logging.level.com.wipro.productcatalog=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.test=DEBUG

# Spring Boot Server
server.port=8080
server.servlet.context-path=/productcatalog

# DataSource - Testcontainers MySQL will override this
# But we keep it for reference
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/productcatalog_test
spring.datasource.username=testuser
spring.datasource.password=testpass

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (for debugging if needed)
spring.h2.console.enabled=false

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Test Configuration
spring.test.mockmvc.print=true
