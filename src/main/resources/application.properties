# ============================================
# Application Configuration
# ============================================
spring.application.name=Product Catalog Management System
server.port=8080
server.servlet.context-path=/productcatalog

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.wipro.productcatalog=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# H2 Database Configuration
# ============================================
spring.datasource.url=jdbc:h2:mem:productcatalogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# JPA/Hibernate Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# H2 Console Configuration
# ============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# Jackson Configuration
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

# ============================================
# Server Configuration
# ============================================
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================
# Springdoc OpenAPI (Swagger UI) Configuration
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=false
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.doc-expansion=list

# ============================================
# Swagger UI Access URLs
# ============================================
# Swagger UI: http://localhost:8080/productcatalog/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/productcatalog/v3/api-docs
# OpenAPI YAML: http://localhost:8080/productcatalog/v3/api-docs.yaml
# ============================================
